<!DOCTYPE html>
<html>
<head>
    <title>
        To-Do-App
    </title>
    <style>
        body {
            font-family: Arial;
            background: 
linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            width: 320px;
            border-radius: 0 10px 25px
rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 15px;
        }

        input { 
            width: 70%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }    

        button {
            padding: 8px 10px;
            border: none;
            background: #667eea;
            color: white;
            border-radius: 5px;
            cursor: pointer;   
        }

        button:hover {
            background: #5a67d8;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 15px;
        }

        li {
            background: #f1f1f1;
            margin: 5px 0;
            padding: 8px;
            border-radius: 5px;
            display: flex;
            justify-content: space-betwwen;
            align-items: center;
        }

        .delete {
            background: red;
            padding: 5px;
            border-radius: 4px;
            font-size: 12px;
        }

        .delete:hover {
            background: darkred;
        }  
    </style>
</head>  

<body>

    <div class="container">
        <h2>My To-Do List</h2>
        <input type="text" id="taskInput"
placeholder="Enter task">   
        <button onclick="addTask()">Add</button> 

        <ul id="taskList"></ul>
    </div>

    <script>

function addTask() {
    let input = document.getElementById("taskInput");
    let task = input.value.trim();

    if (task === "") {
        alert("Please enter a task!");
        return;
    }
let li = document.createElement("li");
    li.innerText = task + " ";

    let button = document.createElement("button");
    button.innerText = "delete";
    button.className = "delete";

    button.onclick = function () {
        li.remove();
        saveTasks();
    };

    li.appendChild(button);

    document.getElementById("taskList").appendChild(li);

    input.value = "";

    saveTasks();
}
function saveTasks() {
    let tasks = [];

    document.querySelectorAll("#taskList li").forEach(function (li) {
        let taskText = li.childNodes[0].textContent.trim();
        tasks.push(taskText);
    });

    localStorage.setItem("todoTasks", JSON.stringify(tasks));
}
function loadTasks() {
    let tasks = JSON.parse(localStorage.getItem("todoTasks")) || [];

    tasks.forEach(function (task) {

        let li = document.createElement("li");
        li.innerText = task + " ";

        let button = document.createElement("button");
        button.innerText = "delete";
        button.className = "delete";
button.onclick = function () {
            li.remove();
            saveTasks();
        };

        li.appendChild(button);

        document.getElementById("taskList").appendChild(li);
    });
}

window.onload = loadTasks;

</script>

</body>   
</html>
