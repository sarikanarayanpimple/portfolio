<!DOCTYPE html>
<html>
<head>
    <title>
        To-Do-App
    </title>
    <style>
        body {
            font-family: Arial;
            background: 
linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            width: 320px;
            border-radius: 0 10px 25px
rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 15px;
        }

        input { 
            width: 70%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }    

        button {
            padding: 8px 10px;
            border: none;
            background: #667eea;
            color: white;
            border-radius: 5px;
            cursor: pointer;   
        }

        button:hover {
            background: #5a67d8;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 15px;
        }

        li {
            background: #f1f1f1;
            margin: 5px 0;
            padding: 8px;
            border-radius: 5px;
            display: flex;
            justify-content: space-betwwen;
            align-items: center;
        }

        .delete {
            background: red;
            padding: 5px;
            border-radius: 4px;
            font-size: 12px;
        }

        .delete:hover {
            background: darkred;
        }  
    </style>
</head>  

<body>

    <div class="container">
        <h2>My To-Do List</h2>
        <input type="text" id="taskInput"
placeholder="Enter task">   
        <button onclick="addTask()">Add</button> 

        <ul id="taskList"></ul>
    </div>

    <script>
        function addTask(){
            let input = document.getElementById("taskInput");
            let task = input.value;

            if (task === "") {
                alert("Please enter a task!");
                return;
            }

           let li = document.createElement("li");

           li.innerHTML = task + 
           "<button class='delete' onclick='this.parentElement.remove()'>delete</button>";

document.getElementById("taskList").appendChild(li);
     
    input.value = ""; 
}    
    </script>

</body>   
</html>
